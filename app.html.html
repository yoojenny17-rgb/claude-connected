            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--card-bg);
            border-radius: 24px;
            box-shadow: 0 10px 25px rgba(255, 142, 165, 0.2);
            width: 100%;
            max-width: 580px;
            padding: 25px;
            box-sizing: border-box;
            border: 4px solid var(--secondary-color);

        .progress-text { font-size: 0.85rem; color: #888; margin-bottom: 15px; }

        .question-box {
            background-color: #FFF0F3;
            border-radius: 16px;
            padding: 15px;
            text-align: center;
            margin-bottom: 20px;
            border: 2px dashed var(--primary-color);
        }

        .options-grid { display: grid; gap: 10px; margin-bottom: 20px; }
        .option-btn {
            background-color: #F0F4F8;
            border: 2px solid #E1E8ED;
            border-radius: 12px;
            padding: 12px;
            font-size: 1rem;
            cursor: pointer;
            font-weight: bold;
            color: var(--text-color);
            transition: all 0.2s ease;
        }
        .option-btn.correct { background-color: #D4EDDA; border-color: var(--accent-color); color: #155724; }
        .option-btn.incorrect { background-color: #F8D7DA; border-color: var(--incorrect-color); color: #721C24; }

        .sentences-section {
            margin-top: 20px;
            display: none;
            background: #FAFAFA;
            padding: 15px;
            border-radius: 16px;
            border: 1px solid #EEE;
        }

            background: white;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 10px;
            border: 2px solid transparent;
        }
        .sentence-card.selected {
            border-color: #3182CE;
            background-color: #F0F9FF;
        }

        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 20px;
            padding: 8px 15px;
            font-size: 0.85rem;
            cursor: pointer;
            font-weight: bold;
        }

            background: #F0F9FF;
            border: 2px solid #BEE3F8;
            border-radius: 14px;
            padding: 15px;
            margin-top: 15px;
        }

            display: inline-block;
            background-color: #2B6CB0;
            color: white;
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: bold;
            margin-bottom: 8px;
        }

            flex-wrap: wrap;
            gap: 8px;
            margin: 12px 0;
            padding: 10px;
            background: white;
            border-radius: 10px;
        }

            padding: 8px 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.95rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 2px solid #E2E8F0;

            color: #2B6CB0; 
            margin-top: 3px;

            font-weight: normal;

            font-size: 0.85rem;
            line-height: 1.6;
            margin-top: 10px;

            background: white;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 8px;

        .feedback-item-title {

            padding: 14px;

</head>

        { v: "go", n: "to bed", m: "잠자리에 들다", s: ["Time to go to bed now.", "I go to bed early every day.", "He went to bed after finishing work."] },
        { v: "go", n: "on vacation", m: "휴가를 떠나다", s: ["We are going on vacation next week.", "She went on vacation to Hawaii.", "I need to go on vacation soon."] },
        { v: "miss", n: "the bus", m: "버스를 놓치다", s: ["Hurry or you will miss the bus.", "I missed the bus this morning.", "She ran fast not to miss the bus."] },
        { v: "miss", n: "an opportunity", m: "기회를 놓치다", s: ["Don't miss an opportunity to learn.", "He missed a great opportunity.", "It is sad to miss an opportunity."] },
        { v: "miss", n: "someone", m: "누군가를 그리워하다", s: ["I miss you so much.", "She misses her family.", "He will miss his friends."] },
        { v: "look", n: "at a picture", m: "사진을 보다", s: ["Look at this old picture.", "She is looking at a picture.", "We looked at the photos together."] },
        { v: "look", n: "for keys", m: "열쇠를 찾다", s: ["I am looking for my keys.", "Did you look for the keys?", "She found them after looking for hours."] },
        { v: "look", n: "after a child", m: "아이를 돌보다", s: ["Can you look after my child?", "She looks after her younger brother.", "Looking after kids is hard work."] },
        { v: "refresh", n: "your memory", m: "기억을 되살리다", s: ["Let me refresh your memory.", "I checked the notes to refresh my memory.", "Look at the map to refresh your memory."] },
        { v: "cancel", n: "an appointment", m: "약속을 취소하다", s: ["I need to cancel my appointment.", "He canceled the doctor appointment.", "Please call if you need to cancel an appointment."] }
    ];

    const ipaDictionary = {
        "i": "/aɪ/", "need": "/niːd/", "to": "/tuː/", "make": "/meɪk/", "a": "/ə/", "decision": "/dɪˈsɪʒn/", "soon": "/suːn/",
        "made": "/meɪd/", "take": "/teɪk/", "break": "/breɪk/", "shower": "/ˈʃaʊər/", "pay": "/peɪ/", "attention": "/əˈtenʃn/",
        "appointment": "/əˈpɔɪntmənt/", "mistake": "/mɪˈsteɪk/", "do": "/duː/", "your": "/jɔːr/", "best": "/best/", "picture": "/ˈpɪktʃər/",
        "money": "/ˈmʌni/", "favor": "/ˈfeɪvər/", "walk": "/wɔːk/", "effort": "/ˈefərt/", "dishes": "/ˈdɪʃɪz/", "medicine": "/ˈmedsn/",
        "friends": "/frendz/", "lose": "/luːz/", "gain": "/ɡeɪn/", "weight": "/weɪt/", "save": "/seɪv/", "waste": "/weɪst/", "spend": "/spend/",
        "time": "/taɪm/", "keep": "/kiːp/", "secret": "/ˈsiːkrət/", "promise": "/ˈprɑːmɪs/", "pass": "/pæs/", "exam": "/ɪɡˈzæm/", "cancel": "/ˈkænsl/"
    };

    function getIPA(word) {
        const clean = word.toLowerCase().replace(/[^\w]/g, '');
        if (ipaDictionary[clean]) return ipaDictionary[clean];
        
        let ipa = clean
            .replace(/th/g, 'θ').replace(/sh/g, 'ʃ').replace(/ch/g, 'tʃ')
            .replace(/ph/g, 'f').replace(/ee/g, 'iː').replace(/oo/g, 'uː')
            .replace(/ea/g, 'iː').replace(/ai/g, 'eɪ').replace(/ay/g, 'eɪ')
            .replace(/a/g, 'æ').replace(/e/g, 'e').replace(/i/g, 'ɪ')
            .replace(/o/g, 'ɑː').replace(/u/g, 'ʌ');
        return `/${ipa}/`;
    }

    const phoneticsDB = {
        "made": { stress: "MADE (단일음절 주강세)", linking: "made a -> /meɪ.də/ (유성 파열음 /d/와 모음 연음)", tip: "💡 팁: 'made'의 /eɪ/ 이중모음은 입을 넓게 벌렸다 오므리며, 끝자음 유성 파열음(/d/)은 혀끝을 상악 치경에 대고 성대를 울려 부드럽게 떼어내세요." },
        "make": { stress: "MAKE (단일음절 주강세)", linking: "make a -> /meɪ.kə/ (무성 파열음 /k/와 모음 연음)", tip: "💡 팁: 'make'의 끝음 /k/는 혀 뒷부분(설후부)을 입천장 부드러운 곳(연구개)에 대었다 떼며 공기를 튀겨주세요." },
        "decision": { stress: "de-CI-sion (2음절 주강세)", linking: "make a decision -> /meɪ.kə.dɪˈsɪ.ʒn/", tip: "💡 팁: 'CI' 발음 시 혀끝을 윗잇몸 뒤쪽에 대고 목소리를 떨어 유성 마찰음(/ʒ/)을 만드세요." },
        "appointment": { stress: "ap-POINT-ment (2음절 주강세)", linking: "an appointment -> /ən.əˈpɔɪnt.mənt/", tip: "💡 팁: 'POINT'의 이중모음(/ɔɪ/)을 크게 벌린 뒤 마지막 /t/는 숨을 잠깐 참으세요." },
        "attention": { stress: "at-TEN-tion (2음절 주강세)", linking: "pay attention -> /peɪ.əˈten.ʃn/", tip: "💡 팁: 'TEN' 부위에서 혀끝을 윗잇몸 치경에 세게 붙였다 떼며 숨을 터뜨리세요." },
        "mistake": { stress: "mis-TAKE (2음절 주강세)", linking: "make a mistake -> /meɪ.kə.mɪˈsteɪk/", tip: "💡 팁: /s/ 소리 뒤의 /t/는 경음화되어 '미스떼이크'처럼 소리 납니다." },
        "picture": { stress: "PIC-ture (1음절 주강세)", linking: "take a picture -> /teɪ.kə.ˈpɪk.tʃər/", tip: "💡 팁: 'PIC'의 무성 파열음(/k/) 후 입술을 오므려 '쳐' 모양의 파찰음(/tʃ/)을 만드세요." },
        "shower": { stress: "SHOW-er (1음절 주강세)", linking: "take a shower -> /teɪ.kə.ˈʃaʊ.ər/", tip: "💡 팁: 첫음 /ʃ/는 입술을 앞으로 둥글게 오므린 채 바람 빠지는 소리를 내세요." },
        "break": { stress: "BREAK (단일음절 주강세)", linking: "take a break -> /teɪ.kə.breɪk/", tip: "💡 팁: /r/ 발음 시 혀끝이 입천장에 닿지 않도록 말아 구부리세요." }
    };

    function getDynamicPhoneticData(word) {
        const clean = word.toLowerCase().replace(/[^\w]/g, '');
        if (phoneticsDB[clean]) return phoneticsDB[clean];

        let tipText = "";
        const lastChar = clean.slice(-1);

        if (['d', 't', 'n', 'l'].includes(lastChar)) {
            tipText = `💡 팁: '${clean}'의 끝음소는 혀끝을 상악 치경(윗잇몸 뒤)에 가볍게 접촉시키고 호흡을 조절하세요.`;
        } else if (['m', 'p', 'b'].includes(lastChar)) {
            tipText = `💡 팁: '${clean}'의 끝음소는 양 입술(양순)을 완전히 붙였다 떼며 소리를 내야 합니다.`;
        } else if (['k', 'g'].includes(lastChar)) {
            tipText = `💡 팁: '${clean}'의 끝음소는 혀 뒷부분을 연구개(입천장 부드러운 곳)에 밀착시킨 뒤 떼어내세요.`;
        } else if (['s', 'z', 'x'].includes(lastChar)) {
            tipText = `💡 팁: '${clean}'의 끝 마찰음은 치아를 마주 보고 혀 사이로 바람을 얇게 내보내세요.`;
        } else {
            tipText = `💡 팁: '${clean}' 발음 시 모음의 호흡 길이를 충분히 유지하면서 다음 단어로 매끄럽게 연결하세요.`;
        }

        return {
            stress: `${clean.toUpperCase()} (주강세 강조)`,
            linking: `${clean} + 다음 모음 자음 연결`,
            tip: tipText
        };
    }

    function build100Dataset() {
        return rawCollocations.map((item, idx) => {
            const verbList = ["make", "take", "do", "pay", "have", "keep", "get", "set", "run", "break", "give", "go", "miss", "look"];
            const wrongVerbs = verbList.filter(v => v !== item.v).sort(() => 0.5 - Math.random()).slice(0, 3);
            const options = [item.v + " " + item.n, ...wrongVerbs.map(v => v + " " + item.n)].sort(() => 0.5 - Math.random());

            return {
                id: idx + 1,
                meaning: item.m,
                correct: item.v + " " + item.n,
                options: options,
                sentences: item.s.map(st => ({ en: st, ko: item.m }))
            };
        });
    }

    const corpusData = build100Dataset();
    const animals = ["🐱", "🐶", "🦊", "🐰", "🐻", "🐼"];
    let availableIndices = [...Array(corpusData.length).keys()];
    let currentData = null;
    let selectedSentenceIndex = 0;
    let recognition = null;

    function getSimilarity(s1, s2) {
        let longer = s1, shorter = s2;
        if (s1.length < s2.length) { longer = s2; shorter = s1; }
        let longerLength = longer.length;
        if (longerLength === 0) return 1.0;
        
        let costs = new Array();
        for (let i = 0; i <= s1.length; i++) {
            let lastValue = i;
            for (let j = 0; j <= s2.length; j++) {
                if (i == 0) costs[j] = j;
                else {
                    if (j > 0) {
                        let newValue = costs[j - 1];
                        if (s1.charAt(i - 1) != s2.charAt(j - 1))
                            newValue = Math.min(Math.min(newValue, lastValue), costs[j]) + 1;
                        costs[j - 1] = lastValue;
                        lastValue = newValue;
                    }
                }
            }
            if (i > 0) costs[s2.length] = lastValue;
        }
        return (longerLength - costs[s2.length]) / parseFloat(longerLength);
    }

    function loadNextQuestion() {
        if (availableIndices.length === 0) {
            alert("🎉 100개 코퍼스 문제를 모두 완수하셨습니다! 다시 시작합니다.");
            availableIndices = [...Array(corpusData.length).keys()];
        }

        document.getElementById("animal-avatar").innerText = animals[Math.floor(Math.random() * animals.length)];
        selectedSentenceIndex = 0;
        
        document.getElementById("progress-text").innerText = `남은 문제: ${availableIndices.length} / ${corpusData.length}`;
        document.getElementById("sentences-section").style.display = "none";
        document.getElementById("feedback-card").style.display = "none";
        document.getElementById("next-btn").style.display = "none";
        document.getElementById("stt-result").innerText = "인식 준비 완료! 버튼을 누르고 읽어보세요.";

        const randomPos = Math.floor(Math.random() * availableIndices.length);
        const dataIndex = availableIndices[randomPos];
        availableIndices.splice(randomPos, 1);

        currentData = corpusData[dataIndex];
        currentData.originalIndex = dataIndex;

        document.getElementById("question-meaning").innerText = `"${currentData.meaning}"`;

        const optionsContainer = document.getElementById("options-container");
        optionsContainer.innerHTML = "";

        currentData.options.forEach((opt) => {
            const btn = document.createElement("button");
            btn.className = "option-btn";
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(opt, btn);
            optionsContainer.appendChild(btn);
        });
    }

    function checkAnswer(selectedOption, buttonEl) {
        const allButtons = document.querySelectorAll(".option-btn");
        allButtons.forEach(btn => btn.disabled = true);

        if (selectedOption === currentData.correct) {
            buttonEl.classList.add("correct");
        } else {
            buttonEl.classList.add("incorrect");
            allButtons.forEach(btn => {
                if (btn.innerText === currentData.correct) btn.classList.add("correct");
            });

            if (!availableIndices.includes(currentData.originalIndex)) {
                availableIndices.push(currentData.originalIndex);
            }
        }

        showSentences();
        document.getElementById("next-btn").style.display = "block";
    }

    function showSentences() {
        const sentencesSection = document.getElementById("sentences-section");
        const sentencesList = document.getElementById("sentences-list");
        sentencesList.innerHTML = "";

        currentData.sentences.forEach((s, idx) => {
            const card = document.createElement("div");
            card.className = "sentence-card";
            card.id = `sentence-card-${idx}`;
            card.innerHTML = `
                <div style="font-weight:bold; font-size:0.95rem; color:#2D3748;">${idx + 1}. ${s.en}</div>
                <div style="font-size:0.85rem; color:#718096; margin-bottom:8px;">${s.ko}</div>
                <button class="btn" onclick="speak('${s.en.replace(/'/g, "\\'")}')">🔊 음성 듣기</button>
                <button class="btn" style="background-color:#3182CE; margin-left:5px;" onclick="selectSentenceForPractice(${idx})">🎤 연습하기</button>
            `;
            sentencesList.appendChild(card);
        });

        sentencesSection.style.display = "block";
        selectSentenceForPractice(0);
    }

    function selectSentenceForPractice(index) {
        selectedSentenceIndex = index;

        document.querySelectorAll(".sentence-card").forEach((card, idx) => {
            if (idx === index) {
                card.classList.add("selected");
            } else {
                card.classList.remove("selected");
            }
        });

        const targetEn = currentData.sentences[index].en;
        document.getElementById("target-sentence-info").innerHTML = `🎯 선택된 문장 (${index + 1}번): <br><strong>"${targetEn}"</strong>`;
        document.getElementById("feedback-card").style.display = "none";
        document.getElementById("stt-result").innerText = "인식 준비 완료! [🎤 녹음 시작하기]를 누르세요.";
    }

    function speak(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = 0.85;
            window.speechSynthesis.speak(utterance);
        }
    }

    function startRecording() {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
            alert("Chrome 브라우저를 사용해 주세요.");
            return;
        }

        const sttResult = document.getElementById("stt-result");

        try {
            recognition = new SpeechRecognition();
            recognition.lang = 'en-US';
            recognition.interimResults = false;

            recognition.onstart = () => {
                sttResult.innerText = "🎙️ IPA 분석 엔진이 듣고 있습니다... 크게 말씀하세요!";
                sttResult.style.color = "#2563EB";
            };

            recognition.onresult = (event) => {
                const userSpeech = event.results[0][0].transcript;
                sttResult.innerText = `인식된 문장: "${userSpeech}"`;
                sttResult.style.color = "#059669";
                analyzePhoneticCoaching(userSpeech, currentData.sentences[selectedSentenceIndex]);
            };

            recognition.onerror = () => {
                sttResult.innerText = "⚠️ 인식 실패. 다시 시도해 주세요.";
                sttResult.style.color = "#DC2626";
            };

            recognition.start();
        } catch (e) {
            sttResult.innerText = "⚠️ 녹음을 시작할 수 없습니다.";
        }
    }

    function analyzePhoneticCoaching(userText, targetSentenceObj) {
        const targetWords = targetSentenceObj.en.replace(/[^\w\s]/gi, '').split(/\s+/);
        const userWords = userText.toLowerCase().replace(/[^\w\s]/gi, '').split(/\s+/);

        const container = document.getElementById("word-analysis-box");
        const detailBox = document.getElementById("feedback-detail-box");
        container.innerHTML = "";
        detailBox.innerHTML = "";

        let feedbackHTML = "";

        targetWords.forEach((targetWord) => {
            const lowerTarget = targetWord.toLowerCase();
            const badge = document.createElement("div");
            
            const targetIPA = getIPA(lowerTarget);
            const pData = getDynamicPhoneticData(lowerTarget);

            let isMatched = false;
            userWords.forEach(uWord => {
                if (getSimilarity(lowerTarget, uWord) >= 0.8) {
                    isMatched = true;
                }
            });

            if (isMatched) {
                badge.className = "phoneme-badge good";
                badge.innerHTML = `<div>${targetWord}</div><div class="ipa-text">${targetIPA}</div>`;
            } else {
                badge.className = "phoneme-badge bad";
                badge.innerHTML = `<div>${targetWord}</div><div class="ipa-text">${targetIPA}</div>`;
                
                feedbackHTML += `
                    <div class="feedback-item">
                        <div class="feedback-item-title">📌 단어 진단: '${targetWord}' <span style="font-weight:normal; font-family:sans-serif; color:#3182CE;">${targetIPA}</span></div>
                        <div>• <strong>음소 및 조음 위치:</strong> ${pData.tip}</div>
                        <div>• <strong>강세 및 억양:</strong> 주강세 위치는 <code>${pData.stress}</code>입니다. 고저차를 명확하게 주어 박자감을 살리세요.</div>
                        <div>• <strong>연음 및 리듬(Coarticulation):</strong> <code>${pData.linking}</code> 연음 규칙을 활용해 기류 끊김 없이 한 호흡으로 이어 읽으세요.</div>
                    </div>
                `;
            }

            container.appendChild(badge);
        });

        if (feedbackHTML === "") {
            feedbackHTML = `
                <div class="feedback-item" style="border-left-color:#48BB78;">
                    <div class="feedback-item-title" style="color:#2F855A;">🎉 완벽한 IPA 발음 및 리듬 달성!</div>
                    <div>• 선택하신 문장의 음소 조음 위치, 주강세 위치, 자음-모음 연음 및 박자감이 원어민 표준 발음 기준에 완벽히 부합합니다.</div>
                </div>
            `;
        }

        detailBox.innerHTML = feedbackHTML;
        document.getElementById("feedback-card").style.display = "block";
    }

    window.onload = loadNextQuestion;
</script>

</body>
</html>
