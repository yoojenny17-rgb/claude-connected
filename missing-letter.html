<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#FFF8E6">
<title>알파벳 숲 탐험 · Alphabet Forest Adventure</title>
<style>
:root{
  --ink:#3b2d4a;
  --cream:#FFF8E6;
  --mint:#DDEFE3;
  --bar:clamp(44px,7vh,70px);
  --cw:150px; --ch:168px;
  --tray-h:200px; --card-w:140px; --gap:20px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{
  font-family:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,-apple-system,"Segoe UI",sans-serif;
  color:var(--ink);
  background:linear-gradient(to bottom,#FFF9EA 0%,#FFF6E2 50%,#E9F3E4 60%,#DDEFE3 74%,#D3E9DA 100%);
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
  touch-action:none;
}
button{font-family:inherit;color:inherit}

/* ---------- 배경 장식 (가장자리에만) ---------- */
#decor{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
#decor svg{position:absolute;display:block}
.dec-grass{left:0;bottom:0;width:100%;height:11vh}
.dec-tree-l{left:-7vmin;bottom:2vh;height:64vh}
.dec-tree-r{right:-6vmin;bottom:1vh;height:70vh}
.dec-mush{left:7vmin;bottom:1vh;height:10vh}
.dec-flow-r{right:10vmin;bottom:.5vh;height:8vh}
.dec-flow-l{left:20vmin;bottom:.2vh;height:6vh}
.dec-cloud1{left:11vw;top:5vh;width:15vw;opacity:.9}
.dec-cloud2{right:14vw;top:9vh;width:11vw;opacity:.85}

#app{position:fixed;inset:0;z-index:1}
.screen{position:absolute;inset:0;display:none;flex-direction:column}
.screen.active{display:flex}

/* ---------- 코너 버튼 ---------- */
#corner{position:fixed;top:calc(8px + env(safe-area-inset-top));right:calc(10px + env(safe-area-inset-right));display:flex;gap:8px;z-index:55;align-items:center}
.cbtn{width:clamp(36px,4.6vmin,50px);height:clamp(36px,4.6vmin,50px);border-radius:50%;
  border:2px solid rgba(59,45,74,.14);background:rgba(255,255,255,.78);display:grid;place-items:center;cursor:pointer;padding:0;
  box-shadow:0 2px 0 rgba(59,45,74,.10)}
.cbtn:active{transform:scale(.92)}
.cbtn svg{width:56%;height:56%;display:block}
.cbtn.pill{width:auto;border-radius:999px;padding:0 12px 0 9px;display:flex;gap:5px;font-size:clamp(11px,1.5vmin,14px);font-weight:700;color:#6b5c4d}
.cbtn.pill svg{width:clamp(18px,2.4vmin,24px);height:auto}
.game-only{display:none !important}
body[data-screen="game"] .game-only{display:grid !important}
body[data-screen="game"] .cbtn.pill.game-only{display:flex !important}
#revealBtn.hide{display:none !important}
#muteBtn .off{display:none}
body.muted #muteBtn .on{display:none}
body.muted #muteBtn .off{display:block}

/* ---------- 시작 화면 ---------- */
#start{align-items:center;justify-content:center;gap:1.6vh;padding:calc(var(--bar) + 1vh) 3vw 5vh}
.title{font-size:clamp(14px,2.3vmin,24px);font-weight:800;color:#8a7558;text-align:center;letter-spacing:.01em;line-height:1.3}
.title small{display:block;font-weight:600;font-size:.72em;color:#a8957a}
#map{width:min(94vw,calc(56vh * 1.92));flex:0 1 auto}
#map svg{width:100%;height:auto;display:block;overflow:visible}
#map .node{cursor:pointer}
#map .node .ring{opacity:0;transition:opacity .25s}
#map .node.sel .ring{opacity:1}
#map .node.sel .nodebody{animation:nodePop .5s ease-out}
#map .node:active .nodebody{transform:scale(.95)}
#mapSq{transition:transform .7s cubic-bezier(.4,1.4,.5,1)}
@keyframes nodePop{0%{transform:scale(1)}40%{transform:scale(1.1)}100%{transform:scale(1)}}
.nodebody{transform-box:fill-box;transform-origin:center}
.startRow{display:flex;gap:3vmin;align-items:center;justify-content:center;flex-wrap:wrap}
.modeBtn{position:relative;width:clamp(120px,22vmin,230px);height:clamp(86px,15vmin,156px);border-radius:3.2vmin;background:#fff;
  border:.6vmin solid #EADFC4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.4vmin;cursor:pointer;
  box-shadow:0 .9vmin 0 #E3D3AD;transition:transform .15s}
.modeBtn:active{transform:translateY(.5vmin)}
.modeBtn.sel{border-color:#FFB547;background:#FFF5D9;box-shadow:0 .9vmin 0 #EFA43A,0 0 0 .7vmin #FFE3A6}
.modeBtn .ic{height:56%;display:flex;justify-content:center}
.modeBtn .ic svg{height:100%;width:auto}
.modeBtn span{font-size:clamp(11px,1.6vmin,16px);color:#7a6a58;font-weight:700}
.modeBtn .tag{position:absolute;left:-1.2vmin;top:-1.2vmin;width:clamp(28px,4.8vmin,46px);height:clamp(28px,4.8vmin,46px);border-radius:50%;
  background:#fff;border:.45vmin solid #EADFC4;display:grid;place-items:center;font-weight:900;font-size:clamp(14px,2.6vmin,26px);color:#8a7558}
.modeBtn.sel .tag{border-color:#FFB547;background:#FFD27A;color:#5a3e10}
.playBtn{width:clamp(92px,17vmin,172px);height:clamp(92px,17vmin,172px);border-radius:50%;cursor:pointer;
  background:radial-gradient(circle at 35% 30%,#A6E6A0,#5FB86A 70%);border:.8vmin solid #fff;
  box-shadow:0 1vmin 0 #3F8F4F,0 1.6vmin 3vmin rgba(59,45,74,.18);display:grid;place-items:center;animation:pulse 1.8s ease-in-out infinite;padding:0}
.playBtn svg{width:46%;height:46%;margin-left:8%}
.playBtn:active{transform:scale(.94)}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}

/* ---------- 게임 화면 ---------- */
#game{padding-top:calc(var(--bar) + env(safe-area-inset-top))}
#hud{position:fixed;top:calc(8px + env(safe-area-inset-top));left:calc(10px + env(safe-area-inset-left));display:none;gap:10px;align-items:center;z-index:50}
body[data-screen="game"] #hud{display:flex}
.chip{display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.8);border-radius:999px;padding:3px 10px 3px 5px;
  height:clamp(36px,4.6vmin,50px);border:2px solid rgba(59,45,74,.12)}
.chip svg{height:82%;width:auto;display:block}
.chip .sep{width:2px;height:60%;background:rgba(59,45,74,.12);margin:0 4px}
#progress{display:flex;gap:clamp(4px,.8vmin,8px);align-items:center}
#progress i{width:clamp(10px,1.5vmin,15px);height:clamp(10px,1.5vmin,15px);border-radius:50%;background:#fff;border:2px solid #DCCDAA;transition:transform .3s}
#progress i.done{background:#FFB547;border-color:#E39528}
#progress i.cur{background:#FFE3A6;border-color:#E39528;transform:scale(1.35)}

#field{flex:1 1 auto;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;padding:0 6vw}
#grid{display:flex;flex-wrap:wrap;justify-content:center;align-content:center}
.slot{position:relative;width:var(--cw);height:var(--ch);transform-origin:50% 90%}
.char{position:absolute;inset:0}
.bob{width:100%;height:100%;animation:bob 3s ease-in-out infinite alternate}
.bob svg{width:100%;height:100%;display:block;overflow:visible}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-3.2%)}}
.eyes{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}95.5%{transform:scaleY(.1)}}

.bush{position:absolute;left:13%;right:13%;bottom:1%;transform-origin:50% 100%;transition:transform .18s ease,filter .18s ease;cursor:pointer}
.bush .bwrap,.bush .rus{transform-origin:50% 100%}
.bush svg{width:100%;height:auto;display:block;overflow:visible}
.bush .rus{animation:rustle 2.6s ease-in-out infinite}
@keyframes rustle{0%,68%,100%{transform:rotate(0)}72%{transform:rotate(-3.5deg)}76%{transform:rotate(3deg)}80%{transform:rotate(-2deg)}84%{transform:rotate(1.2deg)}88%{transform:rotate(0)}}
.bush.near{transform:scale(1.16);filter:drop-shadow(0 0 .9vmin #FFE46B) drop-shadow(0 0 2.2vmin #FFF1A8)}
body.picking .bush{filter:drop-shadow(0 0 .7vmin #FFF0A0)}
body.picking .bush .bwrap{animation:want 1.1s ease-in-out infinite}
@keyframes want{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}

#tray{flex:0 0 auto;height:var(--tray-h);display:none;align-items:center;justify-content:center;gap:var(--gap);
  padding:0 3vw calc(18px + env(safe-area-inset-bottom)) 14vw;position:relative;z-index:6;transition:opacity .4s}
body.mode-B #tray{display:flex}
#tray.closed{opacity:0;pointer-events:none}
.card{position:relative;width:var(--card-w);height:calc(var(--card-w) * 1.1);touch-action:none;cursor:grab;flex:0 0 auto}
.card.dragging,.card.pressed{z-index:40}
.card.dragging{cursor:grabbing}
.card-face{width:100%;height:100%;border-radius:20%;background:linear-gradient(#FFFFFF,#FFF8EA);
  border:max(3px,.45vmin) solid rgba(59,45,74,.14);box-shadow:0 .9vmin 0 rgba(59,45,74,.13),0 1.4vmin 2.4vmin rgba(59,45,74,.10);
  display:grid;place-items:center;padding:7%;transition:transform .2s ease,box-shadow .2s ease}
.card.selected .card-face{transform:translateY(-14%) scale(1.06);box-shadow:0 0 0 .8vmin #FFD15C,0 1.8vmin 2.6vmin rgba(59,45,74,.18)}
.card.dragging .card-face{box-shadow:0 2.4vmin 3.4vmin rgba(59,45,74,.22)}
.card-in{width:100%;height:100%;transform-origin:50% 80%}
.card-in svg{width:100%;height:100%;display:block;overflow:visible}
.hint{position:absolute;right:-18%;top:-26%;width:62%;pointer-events:none;animation:hintBob 1s ease-in-out infinite alternate;z-index:3}
.hint svg{width:100%;height:auto;display:block;overflow:visible}
@keyframes hintBob{from{transform:translateY(0) rotate(-6deg)}to{transform:translateY(-12%) rotate(6deg)}}

#sqMini{position:fixed;left:calc(1.2vmin + env(safe-area-inset-left));bottom:calc(2.2vh + env(safe-area-inset-bottom));width:clamp(64px,12vmin,140px);z-index:7;pointer-events:none;display:none}
body[data-screen="game"] #sqMini{display:block}
#sqMini svg{width:100%;height:auto;display:block;overflow:visible}
#think{position:absolute;left:62%;bottom:80%;width:88%;opacity:0;transform:scale(.4);transform-origin:10% 100%;transition:opacity .3s,transform .4s cubic-bezier(.3,1.6,.5,1)}
#think.on{opacity:1;transform:scale(1)}
#think svg{animation:pulse 1.3s ease-in-out infinite}

#nextBtn{position:fixed;right:calc(3vw + env(safe-area-inset-right));bottom:calc(5vh + env(safe-area-inset-bottom));width:clamp(84px,16vmin,160px);height:clamp(84px,16vmin,160px);
  border-radius:50%;border:.8vmin solid #fff;background:radial-gradient(circle at 35% 30%,#9FD9FF,#4DA3F0 72%);
  box-shadow:0 1vmin 0 #2C78C4,0 1.6vmin 3vmin rgba(59,45,74,.2);display:none;place-items:center;cursor:pointer;z-index:52;padding:0}
#nextBtn.show{display:grid;animation:nextIn .5s cubic-bezier(.3,1.6,.5,1),pulse 1.6s ease-in-out .5s infinite}
#nextBtn svg{width:50%;height:50%}
@keyframes nextIn{from{transform:scale(0)}to{transform:scale(1)}}

/* ---------- 칭찬 화면 ---------- */
#praise{align-items:center;justify-content:center;gap:2vh;padding:calc(var(--bar) + 1vh) 3vw 6vh}
.praiseWrap{display:flex;align-items:flex-end;justify-content:center;gap:3vmin}
#praiseSq{width:clamp(130px,30vmin,320px)}
#praiseSq svg{width:100%;height:auto;display:block;overflow:visible}
#badgeBox{width:clamp(150px,36vmin,380px)}
#badgeBox svg{width:100%;height:auto;display:block;overflow:visible}
.praiseBtns{display:flex;gap:4vmin;margin-top:1vh}
.roundBtn{width:clamp(76px,13vmin,130px);height:clamp(76px,13vmin,130px);border-radius:50%;border:.7vmin solid #fff;cursor:pointer;display:grid;place-items:center;padding:0;
  box-shadow:0 1vmin 0 rgba(59,45,74,.22),0 1.4vmin 2.6vmin rgba(59,45,74,.14)}
.roundBtn svg{width:52%;height:52%}
.roundBtn.green{background:radial-gradient(circle at 35% 30%,#A6E6A0,#5FB86A 72%)}
.roundBtn.sand{background:radial-gradient(circle at 35% 30%,#FFE8B0,#F2BE5E 72%)}
.roundBtn:active{transform:scale(.94)}

/* ---------- 효과 레이어 ---------- */
#fx{position:fixed;inset:0;pointer-events:none;z-index:30;overflow:hidden}
#fx .leaf{position:absolute;left:0;top:0;will-change:transform}
#fx .leaf svg,#fx .pt svg{width:100%;height:100%;display:block;overflow:visible}
#fx .pt{position:absolute;will-change:transform}
#fx .card{position:fixed}

/* ---------- 일시정지 ---------- */
#pauseOv{position:fixed;inset:0;z-index:60;display:none;place-items:center;background:rgba(255,248,230,.72);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
#pauseOv.show{display:grid}
#pauseOv .playBtn{animation:pulse 1.4s ease-in-out infinite}

/* ---------- 설정 ---------- */
#settings{position:fixed;inset:0;z-index:70;display:none;place-items:center;background:rgba(59,45,74,.35);padding:16px}
#settings.show{display:grid}
.panel{background:#FFFDF7;border-radius:22px;width:min(680px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:20px 22px 18px;
  box-shadow:0 20px 50px rgba(59,45,74,.3);touch-action:pan-y;font-size:15px;user-select:text}
.panel h2{margin:0 0 12px;font-size:19px;display:flex;align-items:center;gap:8px}
.panel h2 svg{width:22px;height:22px}
.srow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px dashed #E7DCC4;flex-wrap:wrap}
.srow.col{flex-direction:column;align-items:stretch}
.srow label{font-weight:700;color:#5d4e40}
.srow label small{font-weight:500;color:#9a8a76;margin-left:6px}
.seg{display:flex;background:#F2EAD8;border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;padding:8px 13px;border-radius:9px;cursor:pointer;font-size:14px;font-weight:700;color:#7a6a58}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(59,45,74,.18)}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.quick button{border:1.5px solid #E2D5B8;background:#fff;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;cursor:pointer;color:#6b5c4d}
#letterGrid{display:grid;grid-template-columns:repeat(13,1fr);gap:5px}
#letterGrid button{aspect-ratio:1;border-radius:9px;border:2px solid #E7DCC4;background:#fff;font-weight:900;font-size:clamp(13px,2.4vw,18px);cursor:pointer;opacity:.45;padding:0}
#letterGrid button.on{opacity:1;border-color:currentColor;background:#FFFDF2;box-shadow:inset 0 -3px 0 rgba(59,45,74,.08)}
.warn{color:#D93650;font-size:13px;margin:6px 0 0;min-height:1em}
.note{color:#9a8a76;font-size:12.5px;margin:4px 0 0;line-height:1.5}
.panelFoot{display:flex;justify-content:flex-end;padding-top:14px}
.okBtn{border:0;background:#5FB86A;color:#fff;font-weight:800;font-size:16px;padding:10px 26px;border-radius:12px;cursor:pointer;box-shadow:0 3px 0 #3F8F4F}

#copy{position:fixed;left:50%;bottom:calc(4px + env(safe-area-inset-bottom));transform:translateX(-50%);font-size:11px;color:rgba(59,45,74,.5);z-index:56;pointer-events:none;letter-spacing:.03em}

@media (orientation:portrait){
  .dec-tree-l{height:34vh;left:-12vw}
  .dec-tree-r{height:38vh;right:-12vw}
  .dec-mush{height:6vh}
  .dec-flow-r,.dec-flow-l{height:5vh}
  #field{padding:0 3vw}
  #tray{padding-left:12vw;padding-right:2vw}
}
</style>
</head>
<body data-screen="start">

<div id="decor"></div>

<div id="app">
  <!-- 시작 화면 -->
  <section id="start" class="screen active" aria-label="시작 화면">
    <div class="title">알파벳 숲 탐험 <small>Alphabet Forest Adventure · 없어진 알파벳 찾기</small></div>
    <div id="map"></div>
    <div class="startRow">
      <button class="modeBtn" data-mode="A" aria-label="A 모드: 말로 맞히기"><b class="tag">A</b><span class="ic"></span><span>말로 맞히기</span></button>
      <button class="playBtn" id="playBtn" aria-label="시작"></button>
      <button class="modeBtn" data-mode="B" aria-label="B 모드: 끌어넣기"><b class="tag">B</b><span class="ic"></span><span>끌어넣기</span></button>
    </div>
  </section>

  <!-- 게임 화면 -->
  <section id="game" class="screen" aria-label="게임">
    <div id="field"><div id="grid"></div></div>
    <div id="tray"></div>
  </section>

  <!-- 칭찬 화면 -->
  <section id="praise" class="screen" aria-label="칭찬">
    <div class="praiseWrap">
      <div id="praiseSq"></div>
      <div id="badgeBox"></div>
    </div>
    <div class="praiseBtns">
      <button class="roundBtn green" id="againBtn" aria-label="다시 하기"></button>
      <button class="roundBtn sand" id="mapBtn" aria-label="지도로"></button>
    </div>
  </section>
</div>

<div id="hud">
  <div class="chip" id="chip"></div>
  <div id="progress"></div>
</div>

<div id="corner">
  <button class="cbtn pill game-only" id="revealBtn" aria-label="정답 보기"></button>
  <button class="cbtn game-only" id="homeBtn" aria-label="지도로 돌아가기"></button>
  <button class="cbtn game-only" id="pauseBtn" aria-label="일시정지"></button>
  <button class="cbtn" id="muteBtn" aria-label="소리 켜기/끄기"></button>
  <button class="cbtn" id="fsBtn" aria-label="전체화면"></button>
  <button class="cbtn" id="gearBtn" aria-label="선생님 설정"></button>
</div>

<div id="sqMini"><div id="think"></div></div>
<button id="nextBtn" aria-label="다음"></button>
<div id="fx"></div>

<div id="pauseOv"><button class="playBtn" id="resumeBtn" aria-label="계속하기"></button></div>

<div id="settings" role="dialog" aria-label="선생님 설정">
  <div class="panel">
    <h2><span id="gearIc"></span>선생님 설정</h2>
    <div class="srow"><label>외우는 시간</label><div class="seg" data-k="mem"><button data-v="5">5초</button><button data-v="8">8초</button><button data-v="12">12초</button></div></div>
    <div class="srow"><label>정답 공개 <small>A모드</small></label><div class="seg" data-k="reveal"><button data-v="5">5초</button><button data-v="10">10초</button><button data-v="15">15초</button></div></div>
    <div class="srow"><label>글자 모양</label><div class="seg" data-k="caseMode"><button data-v="upper">대문자 ABC</button><button data-v="lower">소문자 abc</button><button data-v="mixed">섞어서 Aa</button></div></div>
    <div class="srow"><label>한 판 문제 수</label><div class="seg" data-k="qcount"><button data-v="3">3</button><button data-v="5">5</button><button data-v="10">10</button></div></div>
    <div class="srow col">
      <label>출제 범위 <small id="poolInfo"></small></label>
      <div class="quick">
        <button data-q="all">전체 A–Z</button><button data-q="AJ">A–J</button><button data-q="KT">K–T</button><button data-q="UZ">U–Z</button><button data-q="none">모두 해제</button>
      </div>
      <div id="letterGrid"></div>
      <p class="warn" id="poolWarn"></p>
      <p class="note">체크한 글자 중에서 한 화면에 최대 10개가 나옵니다. 10개보다 적게 고르면 고른 개수만큼 나와요.<br>같은 색 계열 글자(예: A·M)는 가능하면 한 화면에 함께 나오지 않게 고릅니다.<br>바뀐 설정은 다음 문제부터 적용됩니다.</p>
    </div>
    <div class="panelFoot"><button class="okBtn" id="settingsOk">확인</button></div>
  </div>
</div>

<div id="copy">© jinienglish</div>

<script>
'use strict';
/* =========================================================
   기본 데이터
   ========================================================= */
const INK = '#3b2d4a';
const LETTERS = [...'ABCDEFGHIJKLMNOPQRSTUVWXYZ'];
const COLOR = {
  A:'#FF5A6E', M:'#D93650', B:'#4D8DFF', N:'#2F5BD8', C:'#FF9A3C', O:'#E8761C',

  if(S.muted || !('speechSynthesis' in window)) return;

const Clock = {t:0, last:performance.now(), paused:false, timers:[]};
const G = {gen:0, items:null, slots:[], hidden:[], filled:new Set(), phase:'idle'};
function tick(now){
  const dt = Math.min(100, now - Clock.last); Clock.last = now;
  if(!Clock.paused){
    Clock.t += dt;
    if(Clock.timers.length){
      const due = Clock.timers.filter(x => x.at <= Clock.t);
      if(due.length){
        Clock.timers = Clock.timers.filter(x => x.at > Clock.t);
        due.forEach(x => { if(x.gen === G.gen) x.fn(); });
      }
    }
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
function after(ms, fn){ Clock.timers.push({at:Clock.t + ms, fn, gen:G.gen}); }

function hillSVG(seed){
  const spots = [[9,99],[22,95.5],[79,95.5],[92,100],[66,101.5],[36,101]];
  const cols = ['#FFB3CF','#FFE07A','#FFFFFF','#C9B3FF','#FFC2A8','#9FD8FF'];
  let fl = '';
  for(let k = 0; k < 3; k++){
    const [x, y] = spots[(seed * 2 + k * 2) % spots.length];
    const c = cols[(seed + k * 2) % cols.length];
    fl += `<g transform="translate(${x} ${y})"><circle cx="-2" cy="0" r="2.1" fill="${c}"/><circle cx="2" cy="0" r="2.1" fill="${c}"/><circle cx="0" cy="-2" r="2.1" fill="${c}"/><circle cx="0" cy="2" r="2.1" fill="${c}"/><circle r="1.3" fill="#FFC93C"/></g>`;
  }
  return `<path d="M-6 108 Q-1 86 50 85 Q101 86 106 108Z" fill="#AED7A4" stroke="#7FAE7A" stroke-width="2.2"/>` +
         `<path d="M6 96 Q22 89 38 89.5" fill="none" stroke="#CBE8C2" stroke-width="3" stroke-linecap="round"/>` +
         `<path d="M14 105 l1.6 -5 l1.6 5 M84 106 l1.6 -5 l1.6 5" fill="none" stroke="#7FAE7A" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>` + fl;
}
function charSVG(ch, low, o = {}){
  const g = (low ? GL : GU)[ch], sw = low ? 14 : 16, col = COLOR[ch];
  const fs = low ? 1.05 : 1.25, ps = low ? .9 : 1.05;
  const blink = o.blink != null ? o.blink : -Math.random() * 5;
  let s = `<svg viewBox="${o.vb || '-6 -18 112 126'}" aria-hidden="true">`;
  if(o.hill !== false) s += hillSVG(o.seed || 0);
  s += `<g transform="translate(0 ${g.dy || 0})">` + strokeLayers(g.d, sw, col, g.dot);
  if(o.prop && PROPS[o.prop]) s += `<g transform="translate(${g.p[0]} ${g.p[1]}) scale(${ps})">${PROPS[o.prop]}</g>`;
  s += `<g transform="translate(${g.f[0]} ${g.f[1]}) scale(${fs})">${faceSVG(o.expr || 'smile', o.prop === 'glasses', blink)}</g></g></svg>`;
  return s;
}
function cardSVG(ch, low, expr){

}

function show(id){

}
function clearFx(){ $('#fx').innerHTML = ''; }
function goMap(){

/* =========================================================
   게임 진행
   ========================================================= */
function startGame(){
  SFX.init();
  G.stage = S.stage; G.mode = S.mode; G.total = S.qcount; G.q = 0; G.prevHidden = [];
  document.body.classList.toggle('mode-B', G.mode === 'B');
  renderHud();
  show('game');
  nextQ();
}
function caseFor(){
  if(S.caseMode === 'lower') return true;
  if(S.caseMode === 'mixed') return Math.random() < .5;
  return false;
}
function pickLetters(){
  const pool = shuffle(S.pool.filter(c => LETTERS.includes(c)));
  const n = Math.min(10, pool.length);
  const used = new Set(), out = [];
  for(const c of pool){ if(out.length >= n) break; if(!used.has(FAMILY[c])){ out.push(c); used.add(FAMILY[c]); } }
  /* 범위가 좁아 피할 수 없을 때만 같은 색 계열 허용 */
  for(const c of pool){ if(out.length >= n) break; if(!out.includes(c)) out.push(c); }
  return shuffle(out);
}
function nextQ(){
  G.gen++; Clock.timers = [];
  clearFx(); hideNext(); setThink(false); setReveal(false);
  document.body.classList.remove('picking');
  G.wrong = 0; G.hint = false; G.filled = new Set(); G.selected = null; G.busy = false; G.drag = null; G.phase = 'memo';
  const letters = pickLetters(), n = letters.length;
  const props = shuffle(PROP_LIST), exprs = shuffle(IDLE_EXPR);
  let lows = letters.map(caseFor);
  if(S.caseMode === 'mixed' && n > 1 && (lows.every(Boolean) || !lows.some(Boolean))) lows[0] = !lows[0];
  G.items = letters.map((ch, i) => ({ch, low:lows[i], prop:props[i % props.length], expr:exprs[i % exprs.length]}));
  /* 사라질 알파벳 고르기 (바로 전 문제와 겹치지 않게 우선) */
  const k = Math.max(1, Math.min(G.stage, n - 1));
  const idx = shuffle(G.items.map((_, i) => i));
  const fresh = idx.filter(i => !G.prevHidden.includes(G.items[i].ch));
  const stale = idx.filter(i => G.prevHidden.includes(G.items[i].ch));
  G.hidden = [...fresh, ...stale].slice(0, k);
  G.prevHidden = G.hidden.map(i => G.items[i].ch);

  renderProgress();
  buildGrid();
  $('#tray').innerHTML = ''; $('#tray').classList.add('closed');
  layout();
  G.slots.forEach((s, i) => s.char.animate(
    [{transform:'translateY(30%) scale(.5)', opacity:0}, {transform:'none', opacity:1}],
    {duration:520, delay:i * 70, easing:'cubic-bezier(.3,1.5,.5,1)', fill:'backwards'}));
  after(120, () => SFX.sparkle());
  after(600 + n * 70 + S.mem * 1000, sweep);
}
function buildGrid(){
  const grid = $('#grid'); grid.innerHTML = '';
  G.slots = G.items.map((it, i) => {
    const el = document.createElement('div'); el.className = 'slot';
    const ch = document.createElement('div'); ch.className = 'char';
    ch.innerHTML = `<div class="bob" style="animation-duration:${rnd(2.4, 3.6).toFixed(2)}s;animation-delay:-${rnd(0, 3).toFixed(2)}s">${charSVG(it.ch, it.low, {prop:it.prop, expr:it.expr, seed:i})}</div>`;
    el.appendChild(ch); grid.appendChild(el);
    return {el, char:ch, bush:null};
  });
}
function setExpr(i, expr){
  const it = G.items[i];
  G.slots[i].char.querySelector('.bob').innerHTML = charSVG(it.ch, it.low, {prop:it.prop, expr, seed:i});
}
function layout(){
  if(document.body.dataset.screen !== 'game' || !G.items) return;
  if(G.mode === 'B'){
    const th = Math.max(110, Math.min(250, innerHeight * .27));
    document.documentElement.style.setProperty('--tray-h', th + 'px');
    layoutTray();
  }
  const f = $('#field'), cs = getComputedStyle(f);
  const W = f.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const H = f.clientHeight - 10;
  const n = G.items.length, AR = 112 / 126;
  let best = 0, bc = 1;
  for(let c = 1; c <= n; c++){
    const r = Math.ceil(n / c), cw = Math.min(W / c, (H / r) * AR);
    if(cw > best + .5){ best = cw; bc = c; }
  }
  const rows = Math.ceil(n / bc); bc = Math.ceil(n / rows);
  const cw = Math.min(best * .97, H * .85 * AR);
  document.documentElement.style.setProperty('--cw', cw + 'px');
  document.documentElement.style.setProperty('--ch', (cw / AR) + 'px');
  $('#grid').style.width = (bc * cw + 1) + 'px';
}
function layoutTray(){
  const tray = $('#tray'), cards = [...tray.querySelectorAll('.card')], k = cards.length;
  if(!k) return;
  const cs = getComputedStyle(tray);
  const th = parseFloat(cs.height) - parseFloat(cs.paddingBottom);
  const tw = tray.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const gap = Math.max(12, innerWidth * .022);
  const cw = Math.max(60, Math.min((th - 14) / 1.1, (tw - gap * (k - 1)) / k, 220));
  document.documentElement.style.setProperty('--card-w', cw + 'px');
  document.documentElement.style.setProperty('--gap', gap + 'px');
}

/* 바람 + 나뭇잎 */
const passT = (x) => 300 + 1800 * (x + .2) / 1.4;
function sweep(){
  G.phase = 'sweep';
  SFX.wind();
  const fx = $('#fx'), W = innerWidth, fr = $('#field').getBoundingClientRect(), vm = vmin();
  const N = Math.min(120, Math.round(70 + 40 * (fr.width * fr.height) / (1400 * 700)));
  const x0 = -.2 * W, x1 = 1.2 * W;
  for(let i = 0; i < N; i++){
    const el = document.createElement('div'); el.className = 'leaf';
    const sz = rnd(7, 14) * vm; el.style.width = sz + 'px'; el.style.height = (sz * .6) + 'px';
    el.innerHTML = leafSVG(); fx.appendChild(el);
    const y = fr.top + rnd(-.05, 1.0) * fr.height - sz * .3, amp = rnd(-9, 9) * vm;
    const r0 = rnd(0, 360), rs = (Math.random() < .5 ? -1 : 1) * rnd(180, 540);
    const P = (t, dy) => `translate(${x0 + (x1 - x0) * t}px,${y + dy}px) rotate(${r0 + rs * t}deg)`;
    const a = el.animate([{transform:P(0, 0)}, {transform:P(.25, amp)}, {transform:P(.5, -amp * .6)}, {transform:P(.75, amp * .8)}, {transform:P(1, 0)}],
      {duration:1800, delay:rnd(0, 600), easing:'linear', fill:'both'});
    a.onfinish = () => el.remove();
  }
  G.slots.forEach((s) => {
    const c = center(s.el), t = passT(c.x / W);
    s.el.animate([{transform:'none'}, {transform:'rotate(7deg) skewX(-5deg)', offset:.4}, {transform:'rotate(-3deg)', offset:.75}, {transform:'none'}],
      {duration:900, delay:Math.max(0, t - 380), easing:'ease-in-out'});
  });
  G.hidden.forEach(i => { const c = center(G.slots[i].el); after(passT(c.x / W), () => hideSlot(i)); });
  after(2450, startGuess);
}
function hideSlot(i){
  const s = G.slots[i];
  s.char.getAnimations().forEach(a => a.cancel());
  const a = s.char.animate([{opacity:1, transform:'none'}, {opacity:0, transform:'translateY(12%) scale(.5)'}], {duration:260, fill:'forwards'});
  a.onfinish = () => { s.char.style.visibility = 'hidden'; a.cancel(); };
  const b = document.createElement('div'); b.className = 'bush';
  b.innerHTML = `<div class="bwrap"><div class="rus" style="animation-delay:-${rnd(0, 2.6).toFixed(2)}s">${BUSH}</div></div>`;
  b.addEventListener('pointerdown', (e) => onBushTap(i, e));
  s.el.appendChild(b); s.bush = b;
  b.animate([{transform:'scale(0)', opacity:0}, {transform:'scale(1.12)', opacity:1, offset:.7}, {transform:'scale(1)', opacity:1}],
    {duration:420, delay:140, easing:'ease-out', fill:'backwards'});
  after(160, () => SFX.rustle(.8));
}
function startGuess(){
  G.phase = 'guess';
  setReveal(true);
  if(G.mode === 'A'){
    setThink(true);
    after(S.reveal * 1000, revealRest);
  } else {
    buildTray();
  }
}

/* 정답 공개 (A모드 자동 / 선생님 버튼) */
function revealRest(){
  if(G.phase !== 'guess') return;
  G.phase = 'reveal';
  setReveal(false); setThink(false); deselect();
  if(G.drag){ const c = G.drag.c; G.drag = null; c.classList.remove('dragging', 'pressed'); c.style.transform = ''; }
  markNear(-1e4, -1e4);
  const rest = G.hidden.filter(i => !G.filled.has(i));
  if(G.mode === 'B') $('#tray').classList.add('closed');
  rest.forEach((i, k) => after(k * 1300, () => peek(i)));
  after(rest.length * 1300 + 600, finishQ);
}
const SHAKE = [{transform:'rotate(0)'}, {transform:'rotate(-7deg)'}, {transform:'rotate(6deg)'}, {transform:'rotate(-5deg)'}, {transform:'rotate(4deg)'}, {transform:'rotate(-2deg)'}, {transform:'rotate(0)'}];
function peek(i){
  const s = G.slots[i];
  G.filled.add(i);
  SFX.rustle();
  if(s.bush) s.bush.querySelector('.bwrap').animate(SHAKE, {duration:380});
  after(380, () => {
    if(s.bush){
      const b = s.bush; s.bush = null;
      const a = b.animate([{transform:'scale(1)', opacity:1}, {transform:'translateY(25%) scale(.3)', opacity:0}], {duration:300, fill:'forwards'});
      a.onfinish = () => b.remove();
    }
    showChar(i, 'pop'); SFX.pop();
    const c = center(s.el); burst(c.x, c.y, 18);
    after(200, () => SFX.sparkle());
    after(260, () => speak(G.items[i].ch));
  });
}
function showChar(i, kind){
  const s = G.slots[i];
  s.char.getAnimations().forEach(a => a.cancel());
  s.char.style.visibility = 'visible';
  setExpr(i, 'happy');
  if(kind === 'pop'){
    s.char.animate([{transform:'translateY(40%) scale(.3)', opacity:0}, {transform:'translateY(-14%) scale(1.12)', opacity:1, offset:.55},
      {transform:'translateY(4%) scale(.96)', opacity:1, offset:.8}, {transform:'none', opacity:1}], {duration:650, easing:'ease-out'});
  } else {
    s.char.animate([{transform:'translateY(-12%) scale(1.1,.92)'}, {transform:'translateY(2%) scale(1.14,.84)', offset:.35},
      {transform:'scale(.95,1.07)', offset:.7}, {transform:'none'}], {duration:440, easing:'ease-out'});
  }
}
function finishQ(){
  if(G.phase === 'done') return;
  G.phase = 'done';
  setReveal(false); setThink(false); deselect();
  $('#tray').classList.add('closed');
  celebrate(G.mode === 'B' ? 1 : .7);

}
function celebrate(level){
  SFX.celebrate();

  G.slots.forEach((s, i) => { if(G.hidden.includes(i)) return;
    s.char.animate([{transform:'none'}, {transform:'translateY(-8%)', offset:.4}, {transform:'none'}], {duration:520, delay:i * 40, easing:'ease-out'}); });
  const sq = $('#sqMini svg');

}
function showNext(){ const b = $('#nextBtn'); b.classList.add('show'); }
function hideNext(){ $('#nextBtn').classList.remove('show'); }
function onNext(){

/* 칭찬 화면 */
function praise(){
  G.gen++; Clock.timers = []; G.phase = 'praise';
  clearFx(); setThink(false);
  S.badges[G.stage] = (S.badges[G.stage] || 0) + 1; save();

      {duration:650, easing:'ease-out'});

/* =========================================================
   B모드: 보기 카드
   ========================================================= */
function buildTray(){
  const tray = $('#tray'); tray.innerHTML = '';
  const ans = G.hidden.map(i => ({ch:G.items[i].ch, low:G.items[i].low}));
  const shown = new Set(G.items.map(x => x.ch));
  const need = 2;  /* Stage1: 1+2=3, Stage2: 2+2=4, Stage3: 3+2=5 */
  const inPool = shuffle(S.pool.filter(c => !shown.has(c)));
  const outPool = shuffle(LETTERS.filter(c => !shown.has(c) && !S.pool.includes(c)));
  const dis = [...inPool, ...outPool].slice(0, need).map(ch => ({ch, low:caseFor()}));
  const opts = shuffle([...ans, ...dis]);
  opts.forEach((o, k) => {
    const c = document.createElement('div'); c.className = 'card';
    c.dataset.ch = o.ch; c.dataset.low = o.low ? '1' : '0';
    c.innerHTML = `<div class="card-face"><div class="card-in">${cardSVG(o.ch, o.low, 'smile')}</div></div>`;
    tray.appendChild(c); bindCard(c);
    c.animate([{transform:'translateY(130%)', opacity:0}, {transform:'translateY(-8%)', opacity:1, offset:.7}, {transform:'none', opacity:1}],
      {duration:520, delay:k * 90, easing:'ease-out', fill:'backwards'});
  });
  tray.classList.remove('closed');
  layoutTray();
  after(100, () => SFX.sparkle());
}
function bindCard(c){
  c.addEventListener('pointerdown', (e) => {
    if(G.phase !== 'guess' || G.busy || c.dataset.done || G.drag || Clock.paused) return;
    e.preventDefault(); SFX.init();
    try { c.setPointerCapture(e.pointerId); } catch(err) {}
    G.drag = {c, id:e.pointerId, x0:e.clientX, y0:e.clientY, moved:false, dx:0, dy:0};
    c.classList.add('pressed');
  });
  c.addEventListener('pointermove', (e) => {
    const d = G.drag; if(!d || d.c !== c || d.id !== e.pointerId) return;
    d.dx = e.clientX - d.x0; d.dy = e.clientY - d.y0;
    if(!d.moved && Math.hypot(d.dx, d.dy) > 12){
      d.moved = true; c.classList.add('dragging');
      deselect(); SFX.tap();
    }
    if(d.moved){
      c.style.transform = `translate(${d.dx}px,${d.dy}px) scale(1.15)`;
      markNear(e.clientX, e.clientY);
    }
  });
  const end = (e) => {
    const d = G.drag; if(!d || d.c !== c || d.id !== e.pointerId) return;
    G.drag = null; c.classList.remove('pressed');
    if(!d.moved){ if(e.type !== 'pointercancel') toggleSelect(c); return; }
    const i = e.type === 'pointercancel' ? -1 : nearBush(e.clientX, e.clientY);
    markNear(-1e4, -1e4);
    if(i >= 0 && G.phase === 'guess') drop(c, i, true);
    else goHome(c);
  };
  c.addEventListener('pointerup', end);
  c.addEventListener('pointercancel', end);
}
function toggleSelect(c){
  if(G.selected === c){ deselect(); return; }
  deselect();
  G.selected = c; c.classList.add('selected');
  document.body.classList.add('picking');
  SFX.tap();
}
function deselect(){
  if(G.selected) G.selected.classList.remove('selected');
  G.selected = null;
  document.body.classList.remove('picking');
}
function onBushTap(i, e){
  if(G.mode !== 'B' || G.phase !== 'guess' || G.busy || Clock.paused) return;
  const s = G.slots[i]; if(!s.bush) return;
  e.preventDefault();
  if(G.selected){ const c = G.selected; deselect(); drop(c, i, false); }
  else { s.bush.querySelector('.bwrap').animate(SHAKE, {duration:380}); SFX.rustle(.7); }
}
function nearBush(x, y){
  let best = -1, bd = 1e9;
  G.hidden.forEach(i => {
    const s = G.slots[i]; if(!s.bush || G.filled.has(i)) return;
    const r = s.bush.getBoundingClientRect();
    const d = Math.hypot(x - (r.left + r.width / 2), y - (r.top + r.height / 2));
    if(d < Math.max(r.width, r.height) * .8 && d < bd){ bd = d; best = i; }
  });
  return best;
}
function markNear(x, y){
  const n = nearBush(x, y);
  G.hidden.forEach(i => { const b = G.slots[i] && G.slots[i].bush; if(b) b.classList.toggle('near', i === n); });
}
function drop(c, i, dragged){
  G.busy = true;
  const ch = c.dataset.ch;
  const t = G.hidden.find(j => G.items[j].ch === ch && !G.filled.has(j));
  if(t !== undefined) correctDrop(c, i, t); else wrongDrop(c, i, dragged);
}
function correctDrop(c, i, t){
  const gen = G.gen;
  G.filled.add(t); c.dataset.done = '1';
  const r = c.getBoundingClientRect();
  const clone = c.cloneNode(true);
  clone.classList.remove('selected', 'dragging', 'pressed');
  clone.style.cssText = `position:fixed;left:${r.left}px;top:${r.top}px;width:${r.width}px;height:${r.height}px;margin:0;transform:none;z-index:45`;
  clone.querySelectorAll('.hint').forEach(h => h.remove());
  $('#fx').appendChild(clone);
  c.style.transform = ''; c.style.visibility = 'hidden'; c.classList.remove('selected', 'dragging');
  const to = (rr) => `translate(${rr.left + rr.width / 2 - (r.left + r.width / 2)}px,${rr.top + rr.height * .56 - (r.top + r.height / 2)}px) scale(${(rr.width * .62 / r.width).toFixed(3)})`;
  const tgt = G.slots[t].el.getBoundingClientRect();
  let kf, dur;
  if(i !== t && G.slots[i].bush){
    /* 다른 덤불에 놓아도 원래 자리로 부드럽게 미끄러져 들어간다 */
    const br = G.slots[i].el.getBoundingClientRect();
    kf = [{transform:'none'}, {transform:to(br), offset:.35}, {transform:to(br), offset:.45}, {transform:to(tgt)}]; dur = 1000;
  } else { kf = [{transform:'none'}, {transform:to(tgt)}]; dur = 420; }
  const a = clone.animate(kf, {duration:dur, easing:'cubic-bezier(.4,0,.2,1)', fill:'forwards'});
  a.onfinish = () => {
    if(gen !== G.gen){ clone.remove(); return; }
    clone.animate([{opacity:1}, {opacity:0}], {duration:140, fill:'forwards'}).onfinish = () => clone.remove();
    fillSlot(t);
  };
}
function fillSlot(t){
  const s = G.slots[t];
  if(s.bush){ s.bush.remove(); s.bush = null; }
  showChar(t, 'snap');
  SFX.snap(); SFX.correct();
  const c = center(s.el); burst(c.x, c.y, 12);
  after(250, () => speak(G.items[t].ch));
  G.busy = false;
  updateHint();
  if(G.hidden.every(j => G.filled.has(j))){
    G.phase = 'celebrate'; setReveal(false); deselect();
    after(800, finishQ);
  }
}
function wrongDrop(c, i, dragged){
  const gen = G.gen;
  G.wrong++;
  const s = G.slots[i];
  c.classList.add('dragging');
  const bounce = () => {
    if(gen !== G.gen) return;
    SFX.boing();
    if(s.bush) s.bush.querySelector('.bwrap').animate(SHAKE, {duration:600});
    setCardExpr(c, 'tongue');
    c.querySelector('.card-in').animate([{transform:'rotate(0)'}, {transform:'rotate(-14deg)'}, {transform:'rotate(12deg)'}, {transform:'rotate(-10deg)'}, {transform:'rotate(7deg)'}, {transform:'rotate(0)'}], {duration:900, easing:'ease-in-out'});
    const cur = c.style.transform || 'none';
    c.style.transform = '';
    const a = c.animate([{transform:cur}, {transform:'translate(0,-38px) scale(1.05)', offset:.45}, {transform:'translate(0,0)', offset:.66},
      {transform:'translate(0,-14px)', offset:.82}, {transform:'translate(0,0)', offset:.92}, {transform:'translate(0,-4px)', offset:.96}, {transform:'none'}],
      {duration:900, easing:'ease-out'});
    a.onfinish = () => { c.classList.remove('dragging'); G.busy = false; };
    after(1500, () => setCardExpr(c, 'smile'));
    if(G.wrong >= 3 && !G.hint){ G.hint = true; after(700, updateHint); }
  };
  if(dragged){ bounce(); return; }
  /* 터치 선택 후 덤불을 눌렀을 때: 덤불까지 날아갔다가 튕겨 나온다 */
  const cr = c.getBoundingClientRect(), br = (s.bush || s.el).getBoundingClientRect();
  const dx = (br.left + br.width / 2) - (cr.left + cr.width / 2), dy = (br.top + br.height / 2) - (cr.top + cr.height / 2);
  const tr = `translate(${dx * .82}px,${dy * .82}px) scale(1.1)`;
  const a = c.animate([{transform:'none'}, {transform:tr}], {duration:330, easing:'ease-in', fill:'forwards'});
  a.onfinish = () => { c.style.transform = tr; a.cancel(); bounce(); };
}
function goHome(c){
  const cur = c.style.transform || 'none';
  c.style.transform = '';
  const a = c.animate([{transform:cur}, {transform:'none'}], {duration:320, easing:'cubic-bezier(.3,1.4,.5,1)'});
  a.onfinish = () => c.classList.remove('dragging');
}
function setCardExpr(c, expr){
  const inn = c.querySelector('.card-in'); if(!inn) return;
  const h = c.querySelector('.hint');
  inn.innerHTML = cardSVG(c.dataset.ch, c.dataset.low === '1', expr);
  if(h && !c.contains(h)) c.appendChild(h);
}
function updateHint(){
  document.querySelectorAll('#tray .hint').forEach(h => h.remove());
  if(!G.hint || G.phase !== 'guess') return;
  const ansSet = new Set(G.hidden.filter(j => !G.filled.has(j)).map(j => G.items[j].ch));
  const card = [...document.querySelectorAll('#tray .card')].find(c => !c.dataset.done && ansSet.has(c.dataset.ch));
  if(!card) return;
  const h = document.createElement('div'); h.className = 'hint'; h.innerHTML = IC.magnifier;
  card.appendChild(h);
  h.animate([{transform:'scale(0)', opacity:0}, {transform:'scale(1.2)', opacity:1, offset:.7}, {transform:'scale(1)', opacity:1}], {duration:450, easing:'ease-out'});
  SFX.sparkle();
  const c = center(card); burst(c.x, c.y - card.offsetHeight * .3, 8, true);
}

/* =========================================================
   효과: 꽃잎 · 반짝이
   ========================================================= */
function burst(x, y, n = 14, sparkOnly = false){
  const fx = $('#fx'), vm = vmin();
  for(let i = 0; i < n; i++){
    const el = document.createElement('div'); el.className = 'pt';
    const isSpark = sparkOnly || Math.random() < .45;
    const sz = (isSpark ? rnd(2.4, 4.4) : rnd(2.6, 4)) * vm;
    el.style.cssText = `left:${x - sz / 2}px;top:${y - sz / 2}px;width:${sz}px;height:${sz}px`;
    el.innerHTML = isSpark ? sparkSVG() : petalSVG();
    fx.appendChild(el);
    const ang = rnd(0, Math.PI * 2), dist = rnd(9, 20) * vm, dx = Math.cos(ang) * dist, dy = Math.sin(ang) * dist, rot = rnd(-240, 240);
    const a = el.animate([
      {transform:'translate(0,0) scale(.2) rotate(0deg)', opacity:1},
      {transform:`translate(${dx}px,${dy}px) scale(1) rotate(${rot * .6}deg)`, opacity:1, offset:.55},
      {transform:`translate(${dx * 1.15}px,${dy + 6 * vm}px) scale(.7) rotate(${rot}deg)`, opacity:0}
    ], {duration:rnd(1000, 1500), easing:'cubic-bezier(.2,.7,.3,1)'});
    a.onfinish = () => el.remove();
  }
}
function rain(n){
  const fx = $('#fx'), vm = vmin(), W = innerWidth, H = innerHeight;
  for(let i = 0; i < n; i++){
    const el = document.createElement('div'); el.className = 'pt';
    const sp = Math.random() < .3, sz = rnd(2.4, 4.4) * vm, x = rnd(0, W);
    el.style.cssText = `left:${x}px;top:${-sz * 2}px;width:${sz}px;height:${sz}px`;
    el.innerHTML = sp ? sparkSVG() : petalSVG();
    fx.appendChild(el);
    const sway = rnd(4, 10) * vm, rot = rnd(-360, 360);
    const a = el.animate([
      {transform:'translate(0,0) rotate(0deg)', opacity:1},
      {transform:`translate(${sway}px,${H * .35}px) rotate(${rot * .35}deg)`, offset:.33},
      {transform:`translate(${-sway}px,${H * .7}px) rotate(${rot * .7}deg)`, offset:.66, opacity:1},
      {transform:`translate(${sway * .5}px,${H + sz * 3}px) rotate(${rot}deg)`, opacity:.6}
    ], {duration:rnd(2400, 3800), delay:rnd(0, 900), easing:'linear', fill:'backwards'});
    a.onfinish = () => el.remove();
  }
}

/* =========================================================
   HUD · 보조 UI
   ========================================================= */
function renderHud(){
  let stars = '';
  for(let i = 0; i < G.stage; i++) stars += `<svg viewBox="-16 -16 32 32">${starIcon(0, 0, 1)}</svg>`;
  $('#chip').innerHTML = `<svg viewBox="-50 -50 100 100">${STAGE_ICON[G.stage]()}</svg>${stars}<span class="sep"></span>${G.mode === 'A' ? IC.bubble : IC.finger}`;
}
function renderProgress(){
  let h = '';
  for(let i = 0; i < G.total; i++) h += `<i class="${i < G.q ? 'done' : i === G.q ? 'cur' : ''}"></i>`;
  $('#progress').innerHTML = h;
}
function setReveal(on){ $('#revealBtn').classList.toggle('hide', !on); }
function setThink(on){ $('#think').classList.toggle('on', !!on); }

/* 일시정지 */
let pausedAnims = [], settingsPaused = false;
function setPause(p, overlay = true){
  if(p === Clock.paused) return;
  Clock.paused = p;
  if(p){
    pausedAnims = document.getAnimations().filter(a => a.playState === 'running');
    pausedAnims.forEach(a => { try { a.pause(); } catch(e) {} });
    try { speechSynthesis.cancel(); } catch(e) {}
    try { if(SFX.ctx) SFX.ctx.suspend(); } catch(e) {}
    if(overlay) $('#pauseOv').classList.add('show');
  } else {
    pausedAnims.forEach(a => { try { if(a.playState === 'paused') a.play(); } catch(e) {} });
    pausedAnims = [];
    try { if(SFX.ctx) SFX.ctx.resume(); } catch(e) {}
    $('#pauseOv').classList.remove('show');
  }
}

/* 설정 */
function openSettings(){
  if(document.body.dataset.screen === 'game' && !Clock.paused){ settingsPaused = true; setPause(true, false); }
  renderSettings();
  $('#settings').classList.add('show');
}
function closeSettings(){
  const pool = S.pool.filter(c => LETTERS.includes(c));
  if(pool.length < 2){ $('#poolWarn').textContent = '알파벳을 2개 이상 골라 주세요.'; return; }
  save();
  $('#settings').classList.remove('show');
  if(settingsPaused){ settingsPaused = false; setPause(false); }
}
function renderSettings(){
  document.querySelectorAll('#settings .seg').forEach(seg => {
    const k = seg.dataset.k;
    seg.querySelectorAll('button').forEach(b => b.classList.toggle('on', String(S[k]) === b.dataset.v));
  });
  const lg = $('#letterGrid');
  if(!lg.children.length){
    LETTERS.forEach(ch => {
      const b = document.createElement('button'); b.textContent = ch; b.dataset.ch = ch; b.style.color = COLOR[ch];
      b.addEventListener('click', () => {
        const set = new Set(S.pool);
        set.has(ch) ? set.delete(ch) : set.add(ch);
        S.pool = LETTERS.filter(c => set.has(c)); renderSettings();
      });
      lg.appendChild(b);
    });
  }
  lg.querySelectorAll('button').forEach(b => b.classList.toggle('on', S.pool.includes(b.dataset.ch)));
  const n = S.pool.length;
  $('#poolInfo').textContent = `${n}개 선택 · 한 화면에 ${Math.min(10, n)}개`;
  $('#poolWarn').textContent = n < 2 ? '알파벳을 2개 이상 골라 주세요.' : '';
}

/* 전체화면 */
function toggleFs(){
  const d = document, el = d.documentElement;
  const isFs = d.fullscreenElement || d.webkitFullscreenElement;
  try {
    if(!isFs){ (el.requestFullscreen || el.webkitRequestFullscreen || function(){}).call(el); }
    else { (d.exitFullscreen || d.webkitExitFullscreen || function(){}).call(d); }
  } catch(e) {}
}

/* =========================================================
   초기화
   ========================================================= */
function init(){
  buildDecor();
  buildMap();
  document.querySelector('.modeBtn[data-mode="A"] .ic').innerHTML = IC.bubble;
  document.querySelector('.modeBtn[data-mode="B"] .ic').innerHTML = IC.finger;
  $('#playBtn').innerHTML = IC.play;
  $('#resumeBtn').innerHTML = IC.play;
  $('#nextBtn').innerHTML = IC.arrow;
  $('#againBtn').innerHTML = IC.again;
  $('#mapBtn').innerHTML = IC.map;
  $('#gearBtn').innerHTML = IC.gear;
  $('#gearIc').innerHTML = IC.gear;
  $('#muteBtn').innerHTML = IC.sound;
  $('#fsBtn').innerHTML = IC.fs;
  $('#pauseBtn').innerHTML = IC.pause;
  $('#homeBtn').innerHTML = IC.home;
  $('#revealBtn').innerHTML = IC.eye + '<span>정답 보기</span>';
  $('#sqMini').insertAdjacentHTML('beforeend', SQUIRREL);
  $('#think').innerHTML = IC.think;
  document.body.classList.toggle('muted', S.muted);
  updateStart();

  document.querySelectorAll('.modeBtn').forEach(b => b.addEventListener('click', () => { SFX.init(); SFX.tap(); S.mode = b.dataset.mode; save(); updateStart(); }));
  $('#playBtn').addEventListener('click', startGame);
  $('#nextBtn').addEventListener('click', onNext);
  $('#againBtn').addEventListener('click', () => { SFX.init(); SFX.tap(); startGame(); });
  $('#mapBtn').addEventListener('click', () => { SFX.init(); SFX.tap(); goMap(); });
  $('#homeBtn').addEventListener('click', () => { SFX.tap(); goMap(); });
  $('#pauseBtn').addEventListener('click', () => { SFX.init(); setPause(true); });
  $('#resumeBtn').addEventListener('click', () => { if(!settingsPaused) setPause(false); });
  $('#revealBtn').addEventListener('click', () => { SFX.init(); revealRest(); });
  $('#muteBtn').addEventListener('click', () => {
    S.muted = !S.muted; save(); document.body.classList.toggle('muted', S.muted);
    if(S.muted){ try { speechSynthesis.cancel(); } catch(e) {} } else { SFX.init(); SFX.tap(); }
  });
  $('#fsBtn').addEventListener('click', toggleFs);
  $('#gearBtn').addEventListener('click', openSettings);
  $('#settingsOk').addEventListener('click', closeSettings);
  $('#settings').addEventListener('click', (e) => { if(e.target.id === 'settings') closeSettings(); });
  document.querySelectorAll('#settings .seg button').forEach(b => b.addEventListener('click', () => {
    const k = b.parentElement.dataset.k, v = b.dataset.v;
    S[k] = isNaN(+v) ? v : +v; renderSettings();
  }));
  document.querySelectorAll('#settings .quick button').forEach(b => b.addEventListener('click', () => {
    const q = b.dataset.q;
    if(q === 'all') S.pool = LETTERS.slice();
    else if(q === 'none') S.pool = [];
    else { const a = LETTERS.indexOf(q[0]), z = LETTERS.indexOf(q[1]); S.pool = LETTERS.slice(a, z + 1); }
    renderSettings();
  }));

  document.addEventListener('pointerdown', () => SFX.init(), {passive:true});
  document.addEventListener('contextmenu', (e) => e.preventDefault());
  document.addEventListener('keydown', (e) => {
    if(document.body.dataset.screen !== 'game' || $('#settings').classList.contains('show')) return;
    if(e.code === 'Space' || e.key === 'p'){ e.preventDefault(); setPause(!Clock.paused); }
    else if((e.key === 'Enter' || e.key === 'ArrowRight') && $('#nextBtn').classList.contains('show')) onNext();
  });
  let rt = 0;
  addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(layout, 80); });
}
init();
</script>
